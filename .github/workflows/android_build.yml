name: Android CI/CD Build & Verification Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  quality_checks_and_build:
    name: Lint, Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: JDK 17 Setup with Gradle Caching
      - name: 2. Set up Java 17 (Temurin) & Enable Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Make Gradle wrapper executable
      - name: 3. Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Build Debug APK
      - name: 4. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 5: Upload Generated Debug APK Artifact
      - name: 5. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Step 6: Unit Tests Gatekeeper
      - name: 6. Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Code Quality & Linting Checks
      - name: 7. Run Android Lint Checks
        run: ./gradlew lintDebug --continue || true
