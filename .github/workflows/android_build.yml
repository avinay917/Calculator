name: Android CI/CD Build & Verification Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_checks_and_build:
    name: Lint, Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: JDK 17 Setup with Gradle Caching
      - name: 2. Set up Java 17 (Temurin) & Enable Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Make Gradle wrapper executable
      - name: 3. Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Build Debug APK
      - name: 4. Build Debug APK
        run: |
          set -o pipefail
          VERSION_CODE=${{ github.run_number }}
          TAG_NAME="v2.${VERSION_CODE}"
          ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName="$TAG_NAME" --stacktrace 2>&1 | tee build_output.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_output.log
          retention-days: 7

      # Step 5: Upload Generated Debug APK Artifact
      - name: 5. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Step 6: Unit Tests
      - name: 6. Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      # Step 7: Code Quality & Linting Checks
      - name: 7. Run Android Lint Checks
        run: ./gradlew lintDebug --continue || true

      # Step 8: Automated OTA Release Publishing & Firebase Update Trigger
      - name: 8. Publish In-App OTA Update Release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          TAG_NAME="v2.${VERSION_CODE}"
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK_PATH" "Calculator-latest.apk"

          COMMIT_MSG=$(git log -1 --pretty=%s | tr '\n' ' ' | sed 's/"/\\"/g')
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Latest automated update with system enhancements and bug fixes."
          fi

          # Cleanly remove old 'latest' release and its associated git tag
          gh release delete "latest" --cleanup-tag --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          # Create public release with latest tag and APK asset
          gh release create "latest" "Calculator-latest.apk" \
            --title "Calculator OTA Release $TAG_NAME" \
            --notes "$COMMIT_MSG" \
            --latest

          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/Calculator-latest.apk"
          TIMESTAMP=$(date +%s%3N)
          JSON_PAYLOAD=$(cat <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$TAG_NAME",
            "apkUrl": "$APK_DOWNLOAD_URL",
            "releaseNotes": "$COMMIT_MSG",
            "isForceUpdate": false,
            "updatedAt": $TIMESTAMP
          }
          EOF
          )

          curl -f -s -X PUT -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "https://apnasatthilko-default-rtdb.asia-southeast1.firebasedatabase.app/app_update.json"

