name: Android CI/CD Build & Verification Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  quality_checks_and_build:
    name: Lint, Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: JDK 17 Setup with Gradle Caching
      - name: 2. Set up Java 17 (Temurin) & Enable Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Make Gradle wrapper executable
      - name: 3. Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Code Quality & Linting Gatekeeper
      - name: 4. Run Android Lint Checks
        run: ./gradlew lintDebug

      # Step 5: Unit Tests Gatekeeper
      - name: 5. Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 6: Build Debug APK (Runs only if Lint & Tests Pass)
      - name: 6. Build Debug APK
        run: ./gradlew assembleDebug

      # Step 7: Upload Generated Debug APK Artifact
      - name: 7. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Step 8: Upload Lint Reports on Failure
      - name: 8. Upload Lint Reports (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # Step 9: Upload Unit Test Reports on Failure
      - name: 9. Upload Unit Test Reports (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
